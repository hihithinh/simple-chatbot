version: "3.1"
language: vi
pipeline:
  # Tiền xử lý chuyên biệt cho Tiếng Việt bằng custom component
  - name: custom_components.vietnamese_preprocessor.VietnameseTextPreprocessor

  # Tokenizer và các featurizer cho đặc trưng thưa (sparse features)
  - name: WhitespaceTokenizer
  - name: LanguageModelFeaturizer
    model_weights: "bert-base-multilingual-cased"
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: "char_wb"  
    min_ngram: 1
    max_ngram: 4
  
  # Classifier chính, sử dụng kết hợp các đặc trưng
  - name: DIETClassifier
    epochs: 100 
    constrain_similarities: true

  - name: EntitySynonymMapper
  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true 
  - name: FallbackClassifier
    threshold: 0.3 
    ambiguity_threshold: 0.1

policies:
- name: MemoizationPolicy
- name: RulePolicy
- name: UnexpecTEDIntentPolicy
  max_history: 5
  epochs: 100
- name: TEDPolicy
  max_history: 5
  epochs: 100
action_endpoint:
  url: "http://localhost:5055/webhook"
assistant_id: 20250510-114333-ornery-wrestler
