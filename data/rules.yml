version: "3.1"
rules:
- rule: Chào hỏi
  steps:
  - intent: greet
  - action: utter_greet
- rule: Kết thúc hội thoại
  steps:
  - intent: goodbye
  - action: utter_goodbye
- rule: Trả lời danh sách các ngành
  steps:
  - intent: hoi_danh_sach_nganh
  - action: utter_ask_nganh
- rule: Trả lời chỉ tiêu chung các ngành
  steps:
  - intent: hoi_chi_tieu_chung
  - action: utter_ask_chi_tieu_chung
- rule: Trả lời thông tin chi tiết ngành khi có entity nganh
  condition:
  - active_loop: null
  - slot_was_set:
    - nganh: true
  steps:
  - intent: hoi_thong_tin_chi_tiet_nganh
  - action: action_tim_thong_tin_nganh
- rule: Trả lời mã ngành khi có entity nganh
  condition:
  - active_loop: null
  - slot_was_set:
    - nganh: true
  steps:
  - intent: hoi_ma_nganh
  - action: action_tim_thong_tin_nganh
- rule: Trả lời chỉ tiêu ngành khi có entity nganh
  condition:
  - active_loop: null
  - slot_was_set:
    - nganh: true
  steps:
  - intent: hoi_chi_tieu_nganh
  - action: action_tim_thong_tin_nganh
- rule: Hỏi hình thức đào tạo
  steps:
  - intent: hoi_hinh_thuc_dao_tao
  - action: utter_ask_hinh_thuc_dao_tao
- rule: Hỏi lệ phí
  steps:
  - intent: hoi_le_phi
  - action: utter_ask_le_phi
- rule: Hỏi thời gian
  steps:
  - intent: hoi_thoi_gian
  - action: utter_ask_thoi_gian
- rule: Hỏi hồ sơ đăng ký
  steps:
  - intent: hoi_ho_so_dang_ky
  - action: utter_ask_ho_so_dang_ky
- rule: Hỏi điều kiện dự tuyển
  steps:
  - intent: hoi_dieu_kien_du_tuyen
  - action: utter_ask_dieu_kien
- rule: Hỏi miễn ngoại ngữ
  steps:
  - intent: hoi_mien_ngoai_ngu
  - action: utter_ask_mien_ngoai_ngu
- rule: Hỏi liên hệ
  steps:
  - intent: hoi_lien_he
  - action: utter_ask_lien_he
- rule: Hỏi phương thức tuyển sinh
  steps:
  - intent: hoi_phuong_thuc_tuyen_sinh
  - action: utter_ask_phuong_thuc_tuyen_sinh
- rule: Hỏi quy trình xét tuyển
  steps:
  - intent: hoi_quy_trinh_xet_tuyen
  - action: utter_ask_quy_trinh_xet_tuyen
- rule: Hỏi tiêu chí trúng tuyển
  steps:
  - intent: hoi_tieu_chi_trung_tuyen
  - action: utter_ask_tieu_chi_trung_tuyen
- rule: Hỏi cấu trúc đề thi
  steps:
  - intent: hoi_cau_truc_de_thi
  - action: utter_ask_cau_truc_de_thi
- rule: Hỏi ôn tập tiếng Anh
  steps:
  - intent: hoi_on_tap_tieng_anh
  - action: utter_ask_on_tap_tieng_anh
- rule: Hỏi đăng ký online
  steps:
  - intent: hoi_dang_ky_online
  - action: utter_ask_dang_ky_online
- rule: Hỏi giấy tờ ngoại ngữ
  steps:
  - intent: hoi_giay_to_ngoai_ngu
  - action: utter_ask_giay_to_ngoai_ngu
- rule: Hỏi kết quả
  steps:
  - intent: hoi_ket_qua
  - action: utter_ask_ket_qua
- rule: Hỏi nhập học
  steps:
  - intent: hoi_nhap_hoc
  - action: utter_ask_nhap_hoc
- rule: fallback
  steps:
  - intent: nlu_fallback
  - action: utter_default
