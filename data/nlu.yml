# Một số ví dụ entity:
# nganh: An toàn thông tin, Công nghệ thông tin, Hệ thống thông tin, Khoa học máy tính, Kỹ thuật máy tính
# ma_nganh: 8480202, 8480201, 8480104, 8480101, 8480106
# chi_tieu: 21, 49, 35, 63, 21
# dia_diem: 07-09 Nguyễn Bỉnh Khiêm, P. Bến Nghé, Q.1, TPHCM
# thoi_gian: 2 năm, ngày 25/5/2025, từ ngày 14/3/2025 - 03/5/2025, tháng 7/2025, tháng 8/2025, 30/5/2025
# loai_ho_so: bìa hồ sơ, phiếu đăng ký, bản sao văn bằng, bảng điểm, chứng chỉ ngoại ngữ, giấy khám sức khỏe, ảnh 3x4, giấy xác nhận sinh viên thủ khoa, bảng điểm bổ túc kiến thức, giấy chứng nhận đối tượng chính sách, giấy khen, chứng nhận kiểm định chương trình, chứng nhận kiểm định cơ sở đào tạo, túi đựng hồ sơ
# doi_tuong: sinh viên thủ khoa, đối tượng chính sách, sinh viên liên thông, sinh viên chương trình tiên tiến
# le_phi: 260.000 đồng, 200.000 đồng
# phuong_thuc: xét tuyển hồ sơ, phỏng vấn chuyên môn, thi đánh giá năng lực tiếng Anh
# quy_trinh: sơ tuyển, xét tuyển hồ sơ, phỏng vấn, đánh giá năng lực ngoại ngữ
# tieu_chi: chuyên môn, năng lực ngoại ngữ, điểm phỏng vấn, chỉ tiêu ngành
# chung_chi: B1, chứng chỉ ngoại ngữ bậc 3, bậc 4, IELTS, TOEFL, TOEIC
# bang_cap: bằng đại học, bằng tốt nghiệp, bằng đại học nước ngoài, bằng ngành ngôn ngữ, bằng ĐHQG-HCM

