<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Tuyển Sinh UIT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="logo">
                <img src="https://www.uit.edu.vn/sites/vi/files/images/Logos/Logo_UIT_Web_Transparent.png" alt="UIT Logo">
            </div>
            <h1>Chatbot Tuyển Sinh Thạc Sĩ UIT</h1>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                <div class="message-content">
                    Xin chào! Tôi là chatbot tư vấn tuyển sinh thạc sĩ của Trường Đại học Công nghệ Thông tin, ĐHQG-HCM. Tôi có thể giúp gì cho bạn?
                </div>
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Nhập câu hỏi của bạn...">
            <button id="send-btn">Gửi</button>
        </div>
        <div class="chat-suggestions">
            <p>Gợi ý câu hỏi:</p>
            <div class="suggestion-chips">
                <button class="chip" onclick="askQuestion('Trường có tuyển sinh ngành nào?')">Ngành tuyển sinh?</button>
                <button class="chip" onclick="askQuestion('Chỉ tiêu các ngành là bao nhiêu?')">Chỉ tiêu?</button>
                <button class="chip" onclick="askQuestion('Điều kiện dự tuyển thạc sĩ là gì?')">Điều kiện dự tuyển?</button>
                <button class="chip" onclick="askQuestion('Lệ phí xét tuyển là bao nhiêu?')">Lệ phí?</button>
                <button class="chip" onclick="askQuestion('Thời gian xét tuyển là khi nào?')">Thời gian?</button>
            </div>
        </div>
    </div>
    <footer>
        <p>© 2025 Trường Đại học Công nghệ Thông tin - ĐHQG-HCM</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
